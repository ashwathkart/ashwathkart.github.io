#-------------------------------
# General Site Settings

title: Ashwath Karthikeyan Portfolio
description: My Project Portfolio # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ashwathkart.github.io/" # the base hostname & protocol for your site, e.g. http://example.com


#-------------------------------
# About Section
author-name:   Ashwath Karthikeyan
author-avatar: profile_pic.jpg
title-front: "Ashwath Karthikeyan - "


#-------------------------------
# Contact links
linkedin: https://www.linkedin.com/in/ashwath-karthikeyan/
github: https://github.com/ashwathkart
email: mailto:ashwath.karthikeyan@gmail.com


#-------------------------------
# Comment Section (Disqus)

#-------------------------------
# Instagram Feed
instafeed: false # To enable the instafeed, use the value true. To turn off use the value false.


#-------------------------------
# Google Analytics
google_analytics: G-TM45RV01C9 # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Newsletter
mailchimp: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e


#-------------------------------
# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap

collections:
  projects:
    output: true
  blogs:
    output: true

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed


