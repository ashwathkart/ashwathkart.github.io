<aside class="sidebar">

  {% include contact-widget.html extra_class="widget-social-sidebar" %}

  <div class="widget widget-tags">
    <h3 class="widget-title">Project Tags</h3>
    {% include tag-cloud.html %}
    <ul class="tag-list list-reset">
    {% for this_word in tag_words %}
      <li class="tag-item"><a href="{{ site.baseurl }}/tags#{{ this_word | cgi_escape }}" class="tag">{{ this_word }}</a></li>
    {% endfor %}
    </ul>
  </div>

</aside> <!-- /.sidebar -->
